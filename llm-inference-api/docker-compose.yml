services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-inference-api-postgres
    ports:
      - "${INFERENCE_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: inference_password
      POSTGRES_DB: llm_inference
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference -d llm_inference"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  # Token buckets, priority-class queues, per-request event logs, routing snapshot.
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: llm-inference-api-valkey
    ports:
      - "${INFERENCE_VALKEY_PORT:-6379}:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
