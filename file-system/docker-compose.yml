services:
  postgres:
    image: postgres:16-alpine
    container_name: file-system-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: file_system
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d file_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
