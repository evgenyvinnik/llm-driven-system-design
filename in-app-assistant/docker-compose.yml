services:
  postgres:
    # pgvector adds the VECTOR type and HNSW index used by the retrieval layer.
    image: pgvector/pgvector:pg16
    container_name: in-app-assistant-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant_password
      POSTGRES_DB: in_app_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d in_app_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: in-app-assistant-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
