services:
  postgres:
    image: postgres:16-alpine
    container_name: freight-quote-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight_password
      POSTGRES_DB: freight_quote
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight_quote"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  # Valkey: Streams stand in for Kafka (event partitions, pricing events, DLQ), plus the
  # component cache, version floors, rate limits, runtime settings and sessions.
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: freight-quote-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
