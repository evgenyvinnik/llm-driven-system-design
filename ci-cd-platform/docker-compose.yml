services:
  # Source of truth: trigger events, runs, the job graph and the claim queue
  # (jobs claimed with FOR UPDATE SKIP LOCKED), leases, secrets (encrypted),
  # log lines until they are archived, and the audit trail.
  postgres:
    image: postgres:16-alpine
    container_name: ci-cd-platform-postgres
    ports:
      - "${CICD_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: cicd
      POSTGRES_PASSWORD: cicd_password
      POSTGRES_DB: ci_cd_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicd -d ci_cd_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  # Sessions, the login rate limit and the log fan-out wake-up. Losing it signs
  # people out and slows live logs to the 2 s poll; no log line is lost.
  redis:
    image: valkey/valkey:7-alpine
    container_name: ci-cd-platform-valkey
    ports:
      - "${CICD_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Artifacts and archived logs. The API creates the bucket on first use.
  minio:
    image: minio/minio:latest
    container_name: ci-cd-platform-minio
    command: server /data --console-address ":9001"
    ports:
      - "${CICD_MINIO_PORT:-9000}:9000"
      - "${CICD_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
