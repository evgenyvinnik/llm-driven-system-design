services:
  postgres:
    image: postgres:16-alpine
    container_name: storage-remediation-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: remediation
      POSTGRES_PASSWORD: remediation_password
      POSTGRES_DB: storage_remediation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remediation -d storage_remediation"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: storage-remediation-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
