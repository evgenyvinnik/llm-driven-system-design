# Host ports can be moved when another stack already holds the defaults, e.g.
#   POSTGRES_PORT=5452 REDIS_PORT=6399 docker-compose up -d
# then point the backend at them with DATABASE_URL / REDIS_URL (see README).
services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-chat-analytics-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_password
      POSTGRES_DB: chat_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d chat_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: llm-chat-analytics-valkey
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: llm-chat-analytics-clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123" # HTTP interface (the only one the app uses)
    environment:
      CLICKHOUSE_DB: chat_analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Single-node Kafka in KRaft mode (no ZooKeeper). The topic is created by the
  # app with 3 partitions, keyed by org_id.
  kafka:
    image: apache/kafka:3.8.1
    container_name: llm-chat-analytics-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres_data:
  valkey_data:
  clickhouse_data:
  kafka_data:
