services:
  postgres:
    image: postgres:16-alpine
    container_name: splitwise-postgres
    environment:
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise_password
      POSTGRES_DB: splitwise
    ports:
      - "5432:5432"
    volumes:
      - splitwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitwise -d splitwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:7-alpine
    container_name: splitwise-redis
    ports:
      - "6379:6379"
    volumes:
      - splitwise_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  splitwise_postgres_data:
  splitwise_redis_data:
