services:
  postgres:
    image: postgres:16-alpine
    container_name: track-hazard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hazard
      POSTGRES_PASSWORD: hazard_password
      POSTGRES_DB: track_hazard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazard -d track_hazard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service name "redis" is what the repo's screenshot/triage scripts look for.
  # Valkey Streams stand in for Kafka (partitioned topics, consumer groups, DLQ); also sessions and live-update pub/sub.
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: track-hazard-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
