
services:
  postgres:
    image: postgres:16-alpine
    container_name: apns-postgres
    environment:
      POSTGRES_USER: apns
      POSTGRES_PASSWORD: apns_password
      POSTGRES_DB: apns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apns"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:7-alpine
    container_name: apns-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_state:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  # Named redis_state rather than redis_data: this service was switched from the
  # redis image to valkey, and Valkey 7.2 refuses to start against an AOF/RDB
  # written by Redis 7 ("Can't handle RDB format version 12"). Anyone with the
  # old volume still on disk hits a boot loop, so the rename forces a clean one.
  # The contents are cache/presence state and are safe to recreate.
  redis_state:
